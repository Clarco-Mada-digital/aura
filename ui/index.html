<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Aura</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Photographie floutée du bureau, posée sous le verre. -->
    <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>

    <main class="shell">
      <header class="bar" id="dragbar">
        <div class="device" id="device">
          <span class="dot" id="dot"></span>
          <span class="device-name" id="deviceName">Recherche…</span>
          <span class="device-meta" id="deviceMeta"></span>
        </div>

        <!-- État des radios du téléphone : indicatifs seulement, cliquer
             ouvre le centre de contrôle. -->
        <div class="net" id="net" hidden>
          <span class="net-item" id="netWifi" title="Wi-Fi">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.5a13 13 0 0 1 17 0"/><path d="M6.5 12.8a8.5 8.5 0 0 1 11 0"/><path d="M9.4 16a4.4 4.4 0 0 1 5.2 0"/><circle cx="12" cy="19" r="0.9"/></svg>
          </span>
          <span class="net-item" id="netBt" title="Bluetooth">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7.5l10 9-5 4V3.5l5 4-10 9"/></svg>
          </span>
          <span class="net-item warn" id="netPlane" title="Mode avion">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 21v-4.6L4 18v-2.4l6.5-4V6a1.5 1.5 0 0 1 3 0v5.6l6.5 4V18l-6.5-1.6V21l-1.5-1z"/></svg>
          </span>
          <span class="net-item warn" id="netDnd" title="Ne pas déranger" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12h7"/></svg>
          </span>
        </div>

        <div class="bar-actions">
          <button class="icon-btn" id="btnNotifs" title="Notifications (Ctrl+N)" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3.6L4.4 16h15.2L18 12.6V9a6 6 0 0 0-6-6Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg>
            <span class="badge" id="notifBadge" hidden>0</span>
          </button>
          <!-- Tout le reste vit dans le centre de contrôle : la barre reste
               lisible même si les fonctions se multiplient. -->
          <button class="icon-btn" id="btnControl" title="Centre de contrôle" aria-label="Centre de contrôle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18.5" cy="12" r="1.1"/></svg>
          </button>
          <button class="icon-btn close" id="btnClose" title="Masquer (Échap)" aria-label="Masquer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </header>

      <!-- Bandeau d'appel : n'apparaît que lorsque le téléphone sonne ou
           qu'une conversation est en cours. -->
      <div class="call" id="call" hidden>
        <span class="call-pulse" aria-hidden="true"></span>
        <div class="call-text">
          <div class="call-state" id="callState">Appel entrant</div>
          <div class="call-who" id="callWho"></div>
        </div>
        <div class="call-actions">
          <button class="call-btn see" id="callSee" title="Voir l'écran du téléphone">Voir</button>
          <button class="call-btn take" id="callTake">Répondre</button>
          <button class="call-btn drop" id="callDrop">Raccrocher</button>
        </div>
      </div>

      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input
          id="query"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Rechercher une application…"
          aria-label="Rechercher une application"
        />
        <kbd class="hint" id="hotkeyHint">Ctrl Alt Espace</kbd>
      </div>

      <!-- Au repos : les favoris seuls. En recherche : les résultats. -->
      <section class="stage">
        <div class="dock" id="dock"></div>
        <div class="hits" id="hits" hidden></div>
        <div class="empty" id="empty" hidden></div>
      </section>

      <footer class="foot">
        <div class="running" id="running"></div>
        <div class="foot-keys" id="footKeys">
          <span><kbd>⏎</kbd>ouvrir</span>
          <span><kbd>Ctrl+D</kbd>favori</span>
        </div>
      </footer>

      <!-- Volet des notifications -->
      <aside class="panel" id="panelNotifs" hidden>
        <div class="panel-head">
          <h2>Notifications</h2>
          <div class="panel-actions">
            <button class="ghost" id="btnClearAll" title="Écarter toutes les notifications" hidden>Tout écarter</button>
            <button class="ghost" id="btnShade" title="Ouvrir le volet sur le téléphone">Téléphone</button>
            <button class="icon-btn" id="btnCloseNotifs" aria-label="Fermer le volet">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>
        <div class="panel-body" id="notifList"></div>
      </aside>

      <!-- Volet des réseaux Wi-Fi -->
      <aside class="panel" id="panelWifi" hidden>
        <div class="panel-head">
          <h2>Wi-Fi</h2>
          <div class="panel-actions">
            <button class="ghost" id="btnWifiScan" title="Relancer une recherche">Rechercher</button>
            <button class="icon-btn" id="btnCloseWifi" aria-label="Fermer les réseaux">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>
        <div class="panel-body" id="wifiBody"></div>
      </aside>

      <!-- Volet des réglages -->
      <aside class="panel" id="panelSettings" hidden>
        <div class="panel-head">
          <h2>Réglages</h2>
          <button class="icon-btn" id="btnCloseSettings" aria-label="Fermer les réglages">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="panel-body" id="settingsBody"></div>
      </aside>

      <div class="toast" id="toast" hidden></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
